name: Analyze native ARB Buy screens

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-native-buy.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download original APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/input
          gh release download arb-inputs-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern "base.apk" --dir build/input
          test -s build/input/base.apk
          unzip -t build/input/base.apk >/dev/null

      - name: Download JADX
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip \
            -o build/jadx.zip
          mkdir -p build/jadx-bin
          unzip -q build/jadx.zip -d build/jadx-bin
          test -x build/jadx-bin/bin/jadx

      - name: Decompile focused native Buy classes
        run: |
          set -euo pipefail
          mkdir -p build/focused
          classes=(
            com.pt.ar.wallet.home.buy.activity.BuyActivity
            com.pt.ar.wallet.home.buy.fragment.BaseBuyFragment
            com.pt.ar.wallet.home.buy.fragment.AutoBuyFragment
            com.pt.ar.wallet.home.buy.fragment.OtpUPIBuyFragment
            com.pt.ar.wallet.home.buy.fragment.BankBuyFragment
            com.pt.ar.wallet.home.buy.fragment.UPIBuyFragment
            com.pt.ar.wallet.home.buy.adapter.BuyOptionalNewAdapter
            com.pt.ar.wallet.home.buy.adapter.BuyTabFragmentAdapter
            com.pt.ar.wallet.home.buy.model.BuyModel
            com.pt.ar.wallet.home.buy.api.ApiBuyService
          )
          for cls in "${classes[@]}"; do
            name="${cls##*.}"
            echo "Decompiling $cls"
            build/jadx-bin/bin/jadx --no-res --quiet --single-class "$cls" \
              --single-class-output "build/focused/$name.java" \
              build/input/base.apk || true
          done
          {
            echo "# Original APK: focused native Buy source"
            echo
            echo "- Package: `com.pt.ar.wallet`"
            echo "- JADX: 1.5.6"
            echo "- Focus: BuyActivity, AutoBuy/UPI/OTP-UPI/Bank fragments, adapter and model"
            echo
            echo "## Decompiled files"
            ls -lh build/focused/*.java
            for f in build/focused/*.java; do
              echo
              echo "## $f"
              sed -n '1,340p' "$f"
            done
          } > build/focused/REPORT.md
          cat build/focused/REPORT.md

      - name: Upload focused source and report
        uses: actions/upload-artifact@v4
        with:
          name: native-buy-screen-analysis
          path: build/focused
          if-no-files-found: error
          retention-days: 7
