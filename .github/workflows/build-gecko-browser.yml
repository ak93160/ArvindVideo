name: Build ARB Gecko Browser

on:
  push:
    branches: [main]
    paths:
      - 'browser/**'
      - '.github/workflows/build-gecko-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore stable debug signing key
        run: |
          set -euo pipefail
          base64 --decode browser/ci-debug.keystore.b64 > browser/ci-debug.keystore
          test -s browser/ci-debug.keystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download the existing XPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p browser/build-input
          gh release download arb-inputs-v1 --repo "${GITHUB_REPOSITORY}" \
            --pattern "extension.xpi" --dir browser/build-input
          test -s browser/build-input/extension.xpi

      - name: Prepare bundled XPI
        run: |
          python3 browser/scripts/prepare_extension.py \
            --xpi browser/build-input/extension.xpi \
            --out browser/app/src/main/assets/extensions/arbbuyer

      - name: Build browser APK
        run: gradle --no-daemon -p browser :app:assembleDebug

      - name: Validate APK before publishing
        run: |
          set -euo pipefail
          APK="browser/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 8
          cp "$APK" browser/app/build/outputs/apk/debug/ARB-Browser-Install-Fix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARB-Browser-Install-Fix
          path: browser/app/build/outputs/apk/debug/ARB-Browser-Install-Fix.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish browser APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arb-browser-install-fix-${{ github.run_number }}
          name: ARB Browser Install Fix ${{ github.run_number }}
          body: |
            Rebuilt ARM64 GeckoView browser with:
            - A clean package ID to avoid conflicts with earlier experimental packages.
            - A stable debug signing certificate and both legacy and modern APK signatures.
            - APK ZIP, signature, alignment, and package metadata validation before release.
            - The included XPI and saved Startup Website setting.
          files: browser/app/build/outputs/apk/debug/ARB-Browser-Install-Fix.apk
          fail_on_unmatched_files: true
