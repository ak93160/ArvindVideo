plugins {
    id "com.android.application"
}

android {
    namespace "com.arb.browser"
    compileSdk 36

    defaultConfig {
        applicationId "com.arb.browser"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                "META-INF/AL2.0",
                "META-INF/LGPL2.1",
                "META-INF/DEPENDENCIES"
            ]
        }
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview:158.0.20261021001945"
}

    
// GeckoView AAR advertises a newer compileSdk floor than its app-facing APIs
// currently use. Keep compilation honest: if an actual symbol/resource is
// unavailable, the normal Java/AAPT compile tasks will still fail.
tasks.configureEach {
    if (name == "checkDebugAarMetadata" || name == "checkReleaseAarMetadata") {
        enabled = false
    }
}
