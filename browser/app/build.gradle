plugins {
    id "com.android.application"
}

android {
    namespace "com.arb.browser"
    compileSdk 37

    defaultConfig {
        applicationId "com.arb.browser"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                "META-INF/AL2.0",
                "META-INF/LGPL2.1",
                "META-INF/DEPENDENCIES"
            ]
        }
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview:160.0.20261104181552"
}
