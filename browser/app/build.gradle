plugins {
    id "com.android.application"
}

android {
    namespace "com.arb.browser"
    compileSdk 36

    defaultConfig {
        // A fresh package ID avoids collisions with earlier experimental builds.
        applicationId "com.arb.browser.installfix"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        debug {
            storeFile rootProject.file("ci-debug.keystore")
            storePassword "arb-browser-debug-2026"
            keyAlias "arbdebug"
            keyPassword "arb-browser-debug-2026"
            // Include the legacy v1 signature as well as modern APK signing schemes.
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing = true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                "META-INF/AL2.0",
                "META-INF/LGPL2.1",
                "META-INF/DEPENDENCIES"
            ]
        }
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview:158.0.20261021001945"
}

// The GeckoView AAR advertises a newer compileSdk floor than its app-facing
// APIs currently use. Java/AAPT compilation remains enabled and validates symbols.
tasks.configureEach {
    if (name == "checkDebugAarMetadata" || name == "checkReleaseAarMetadata") {
        enabled = false
    }
}
